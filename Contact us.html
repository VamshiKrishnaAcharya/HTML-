<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="gvk.jpg">
  <link rel="stylesheet" href="styles.css">
  <title>Contact - GVK Charitable & Educational Trust</title>
</head>
<body>

  <header>
    <img src="image logo 2.jpeg" alt="GVK Charitable & Educational Trust Banner">
  </header>

  <nav>
    <a href="index.html">About</a>
    <a href="programs.html">Programs</a>
    <a href="jobnotification.html">Job Notifications</a>
    <a href="contact.html" class="active">Contact</a>
    <a href="notification.html">Notification</a>
  </nav>

  <main class="container">

    <section>
      <h1>Contact Us</h1>

      <div class="two-column">
        <div>
          <div class="contact-box">
            <div class="contact-item"><span>Address:</span> [Trust registered office address]</div>
            <div class="contact-item"><span>Phone:</span> [Phone number]</div>
            <div class="contact-item"><span>Email:</span> [Email address]</div>
            <div class="contact-item"><span>Office Hours:</span> [e.g. Mon&ndash;Sat, 10 AM&ndash;5 PM]</div>
          </div>
        </div>

        <div>
          <form onsubmit="return false;">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <footer>
    &copy; <span id="year"></span> GVK Charitable &amp; Educational Trust. All rights reserved.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
